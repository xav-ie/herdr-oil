name: Release

# Runs when the release PR from prepare-release.yml merges: tags v<version> (the version in
# Cargo.toml) and creates the GitHub release with CHANGELOG.md's notes. herdr builds plugins
# from source, so there is nothing else to publish.
# To retry one that failed, re-run it from the run's page.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

# One release at a time; never cancel one half-way through publishing.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged && github.head_ref == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tag and create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: knope release --verbose
