[package]
name = "herdr-oil"
version = "0.1.0"
edition = "2024"
description = "Reorganize herdr workspaces and tabs by editing a text file in $EDITOR"
license = "MIT"
repository = "https://github.com/xav-ie/herdr-oil"
keywords = ["herdr", "terminal", "plugin"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
